# Run tests then upload to Pypi on version bumps.
# Run tests on each push.
# Try to bump version
# If version is bumped, upload to pypi or test.pypi depending on branch name.

name: pypi project

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest numpy colormath
        python -m pip install .
    - name: Run tests
      run: pytest

  # Deploy on test.pypi when branch is dev and commit message starts with 'bump'
  deploy-on-testpypi:
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.ref_name == 'dev' && startsWith(github.event.head_commit.message, 'bump:')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  # Deploy on pypi when branch is main and commit message starts with 'bump'
  deploy-on-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs: [tests]
    if: github.ref_name == 'main' && startsWith(github.event.head_commit.message, 'bump:')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
